name: recon_and_baseline_tuning_with_pretrained_dms_flow
required_datasets: [cmrx_cine_processed_2024, cmrx_recon, pddr_checkpoint]

convert_to_video_dataset_task_name: convert_cmrx_to_video_dataset
convert_to_video_dataset_base_config_path: task/convert_cmrx_to_video_dataset
convert_to_video_dataset_config_name: cmrx_fs_sax_lax
convert_to_video_dataset_base_overrides:
  - ++file_limit=1000
  - ++torch_mp_process_count=40
convert_to_video_dataset_task_overrides: {}
convert_to_video_dataset_cache_refresh: False
convert_to_video_dataset_num_gpus: 0

preprocess_video_dataset_base_config_path: task/preprocess_video_dataset_for_pretraining
preprocess_video_dataset_train_config_name: cmrx_train_videovoxel_fs_sax_lax_motion 
preprocess_video_dataset_val_config_name: cmrx_test_videovoxel_fs_sax_lax_motion
preprocess_video_dataset_base_overrides:
  - ++seed=0
  - ++store_warp_parameters=true
  - ++torch_mp_process_count=2
  - ++crop.enabled=False
  - ++warp_method_fit.fit_params.num_iterations=0
  - ++normalization=kspace_attr_norm_video
preprocess_video_dataset_task_overrides: {}
preprocess_video_dataset_cache_refresh: False
preprocess_video_dataset_num_gpus: 2

visualize_base_config_path : task/visualize_vdm_training_dataset
visualize_base_config_name : config
visualize_base_overrides:
  - ++sample_nr=5
visualize_task_overrides: {}
visualize_num_gpus: 1

train_cpl_task_name: train_probabilistic_coupling_model
train_cpl_base_config_path : task/train_probabilistic_coupling
train_cpl_base_config_name : config
train_cpl_overrides:
  - +exps=complex_model_nocache
train_cpl_task_overrides: {}
train_cpl_post_overrides:
  - ++training_steps=50000
  - ++coupling_model.condition_include_warped_nframe=True
  - ++coupling_model.condition_include_motion=True
  - ++coupling_model.prediction_target=residual
  - ++sample_image.sample_video_every=10
  - ++sample_image.params.nr_of_image_samples=2
  - ++sample_image.params.nr_of_image_samples_uploaded_to_wandb=2
  - ++sample_image.sample_steps=100
  - ++use_random_noise=True
  - ++optimizer.lr=5e-4
  - ++dataloader_train.dl_params.num_workers=8
  - ++dataloader_train.dl_params.persistent_workers=True
  - ++dataloader_train.dl_params.prefetch_factor=2
  - ++dataloader_train.dl_params.pin_memory=True
  - ++dataloader_val.dl_params.num_workers=4
train_cpl_cache_refresh: False
train_cpl_num_gpus: 1
train_cpl_cpus_per_task: 10

recon_tuning_config_path : task/tuning_selection
recon_tuning_config_name : config
recon_tuning_overrides:
  - ++selection_method=best_overall
  - ++tune_metric=psnr
  - ++tune_metric_take_max=True
  - ++secondary_mode=none
  - ++secondary_metric=lpips
  - ++secondary_metric_take_max=False
  - ++secondary_metric_max_deviation=0.005
  - ++secondary_soft_penalty_lambda=50.0
recon_tuning_cache_refresh: False
recon_tuning_num_gpus: 1

baseline_tuning_config_path : task/tuning_selection
baseline_tuning_config_name : config
baseline_tuning_overrides:
  - ++selection_method=best_overall
  - ++tune_metric=psnr
  - ++tune_metric_take_max=True
  - ++secondary_mode=none
  - ++secondary_metric=lpips
  - ++secondary_metric_take_max=False
  - ++secondary_metric_max_deviation=0.005
  - ++secondary_soft_penalty_lambda=50.0
baseline_tuning_cache_refresh: False
baseline_tuning_num_gpus: 1


common_hp_sweep_aggregate:
  ++domain_specific_setup.sample_index: range(0,20,3)
common_run_sweep:
  ++domain_specific_setup.sample_index: range(50,100, 1)
common_visual_run_sweep:
  ++domain_specific_setup.sample_index: [50]
common_recon_overrides:
  - ++seed=0
  - ++save_result.enable=False
  - ++animate.warp_animation=False
  - ++animate.init=False
  - ++animate.final=False
  - +domain_specific_setup=cmrx_orig_cmr_12x_smaps
common_visual_recon_overrides_extra: []
common_visual_recon_save_result_enable: True
common_visual_recon_cache_refresh: False
common_visual_recon_num_gpus: 1
common_post_overrides: []

recon_recon_config_path : task/cmr_recon
recon_recon_config_name : voxelrep_base
recon_recon_sweep:
  +exps: [noapp_learntcpl_var, noapp_confpm_var]
recon_recon_hp_overrides:
  - ++trainer.iterations=999
recon_recon_hp_sweep_tune_basic_key: sweep
recon_recon_hp_sweep_tune_extra: {}
recon_recon_hp_log_wandb: False
recon_recon_run_overrides:
  - ++trainer.iterations=999
recon_recon_cache_refresh: False
recon_recon_num_gpus: 1
recon_recon_hp_budget_trials_per_param: 8
recon_recon_hp_refine_budget_trials_per_param: 4

baseline_recon_config_path : task/recon_baseline
baseline_recon_config_name : base
baseline_recon_sweep:
  +exps: [lps, pddr_native]
baseline_recon_hp_overrides:
  - ++baseline_params.max_iter=500
baseline_recon_hp_sweep_tune_basic_key: sweep
baseline_recon_hp_sweep_tune_extra: {}
baseline_recon_hp_log_wandb: False
baseline_recon_run_overrides:
  - ++baseline_params.max_iter=500
baseline_recon_cache_refresh: False
baseline_recon_num_gpus: 1
baseline_recon_hp_budget_trials_per_param: 8
baseline_recon_hp_refine_budget_trials_per_param: 4

plot_config_path: task/plot
plot_config_name: seaborn_sweep_plot
plot_overrides:
  - ++tradeoff_plots_enabled=False
  - ++stochastic_params=['++domain_specific_setup.sample_index', '++seed']
  - ++paper_summary_table_enabled=True
  - ++paper_winrate_table_enabled=True
  - ++paper_summary_metrics_filter=["psnr_mag", "psnr_compl", "nmse_mag", "ssim_slicewise", "ssim3d"]
  - ++winrate_over_param="++domain_specific_setup.sample_index"
plot_num_gpus: 1

plot_visual_enabled: True
plot_visual_config_path: task/plot_visual
plot_visual_config_name: visual_examples
plot_visual_overrides:
  - ++visual_examples_enabled=True
  - ++visual_examples_frame_idxs=[0,1,2,3,4,5,6]
  - ++visual_examples_stochastic_params=['++seed']
  - ++visual_examples_col_param="+exps"
  - ++visual_examples_max_rows=4
  - ++visual_examples_max_cols=20
  - ++visual_examples_auxiliary_layout=columns
  - ++visual_examples_auxiliary_position=start
  - ++visual_examples_metric_overlay_enabled=True
  - ++visual_examples_metric_overlay_metrics=["psnr_compl","nmse_mag","ssim_slicewise"]
  - ++visual_examples_metric_overlay_text_color=white
  - ++visual_examples_normalize_brightness=False  # recon.pt is stored unscaled
  - ++visual_examples_time_slice_mode=y-t
  - ++visual_examples_time_slice_size_ratio=0.25
  - ++visual_examples_time_slice_center_col=64
  - ++visual_examples_include_pseudoinv=True
  - ++visual_examples_include_reference=True
  - ++visual_examples_formats=[png,svg]
  - ++visual_examples_video_enabled=True
  - ++visual_examples_video_fps=8
plot_visual_num_gpus: 1