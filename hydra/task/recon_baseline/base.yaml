defaults:
  - animate: multi_frame

seed: 0

save_result:
  enable: False
  save_in_fp16: True

storage_settings:
  is_remote: true
  bucket_or_base_path: ml-models
  storage_name: ml-models

animate:
  init: True
  final: True
  params:
    nr_frames: -1
    time_start: 0
    time_end: -1
    chunks: 1

    eval_cropping:
      lx: 0
      rx: null
      ty: 0
      by: null

    eval_rot90: false
  
  warp_animation: false
  warp_animation_quiver_enable : false
  warp_animation_quiver_cfg:
    scale: 0.003
    figsize: [3,3]
    dpi: 200
  warp_animation_color_enable: true
  warp_animation_color_cfg:
    percentile: 99.0
  warp_animation_overlay_enable: true
  warp_animation_overlay_cfg:
    use_pairwise_deltas: True
    arrow_scale: 0.0001
    arrow_stride: 8
