defaults:
  - trainer: binned_kspace
  - loss_fn: mse
  - regularizer_fn: none
  - representation: VideoVoxelRepr
  - animate: multi_frame

seed: 1

model_initializer:
  name: video_and_motion_init_full

representation:
  motion_is_velocity: True
  add_motion_parameter: True
  add_motion_bwd_parameter: True
  add_occlusion_weighting_parameter: True
  add_template_parameter: False

trainer:
  iterations: 10
  scheduler_kwargs:
    mode: "min"
    factor: 0.5
    patience: 10
  chunks: 1
  skip_temp: False
  img_eval_every_iters: 5
  lam_reg_init_frame: 0.0
  lam_reg_temporal_change: 0.0

optimizer:
  lr: 0.2
  motion_lr: 0.001

save_result:
  enable: False
  save_in_fp16: True

storage_settings:
  is_remote: true
  bucket_or_base_path: ml-models
  storage_name: ml-models

animate:
  init: True
  final: True
  params:
    nr_frames: -1
    time_start: 0
    time_end: -1
    chunks: 1

    eval_cropping:
      lx: 0
      rx: null
      ty: 0
      by: null

    eval_rot90: false
  
  warp_animation: false
  warp_animation_quiver_enable : false
  warp_animation_quiver_cfg:
    scale: 0.003
    figsize: [3,3]
    dpi: 200
  warp_animation_color_enable: true
  warp_animation_color_cfg:
    percentile: 99.0
  warp_animation_overlay_enable: true
  warp_animation_overlay_cfg:
    use_pairwise_deltas: True
    arrow_scale: 0.0001
    arrow_stride: 8