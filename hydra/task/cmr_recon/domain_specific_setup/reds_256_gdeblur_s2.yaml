# reds | 720x1280 frames -> 640 center-crop -> nearest-downscale 256, first 10 frames | Gaussian blur, kernel_size=31, std=2.0 | slight measurement noise (std 0.001)

name: natural_video_setup

base_path: raw/reds

sample_index: 0
video_length_in_s: 1.0
set_forward_model: true
target_as_pseudoinv_in_reg: false
scale_measurement: true
additive_gaussian_noise_std: 0.001

forward_model_cfg:
  name: blurring
  kernel_size: 31
  std: 2.0
  kernel_size_t: 1

dataset_cfg:
  name: reds
  split: val  # 30-video held-out split
  target_folder: val_sharp  # <split>/<split>_sharp/<video_id>
  measurement_folder: null  # simulated on the fly
  frame_glob: "*.png"
  temporal_cropping_lb: 0 # first 10 frames only (memory)
  temporal_cropping_ub: 10
  simulation_cfg:  # overwritten by forward_model_cfg
    name: blurring
    kernel_size: 31
    std: 2.0
    kernel_size_t: 1
  crop_and_downscale_cfg:
    enabled: true
    size_before_downscale: 640
    size_after_downscale: 256
