# @package _global_
# noapp_learntcpl_var + the ADM image-diffusion appearance prior of adm_nocpl_var.
# timestep_jitter_fraction pinned to 0.0 (cpl_idm_adm default 0.2) so the appearance prior matches across the adm row.
defaults:
  - override /regularizer_fn: composite_motion_appearance_coupling_cpl_idm_adm

optimizer:
  occlusion_lr: 0.1
  lr: 0.1
  motion_lr: 0.0

model_initializer:
  motion_init: "raft"

regularizer_fn:
  motion_regularizer:
    weight: 0.0
    loss_norm: l1

  coupling_regularizer:
    # passed to pipe loading / init
    forward_fn_params:
      use_final_model: true
      use_epoch : null
      use_pass_through: false
      model_type: UNet2DCondition

    # passed as partial to the regularizer
    reg_params:
      weight : 0.0

    reg_params_var_spec:
      num_train_steps_factor_lower : 0.0
      num_train_steps_factor_upper : 0.4
      adapt_reg_strength: true
      include_backward : true
      occlusion_weight : 1.0
      occlusion_fwd_relative : 1.0
      occlusion_bwd_relative : 1.0
      tau_pix : 1.0
      conf_floor : 0.0
      enable_occlusion_masking : false
      apply_scaling_factor_from_setup: False
      use_sin_cos_annealing: True
      normalization: "none"
      target_l1_weight: null

  appearance_regularizer:
    reg_params:
      reg_strength: 1e-2
      noise_mode: "fully_random"
      consistent_timestep: True
      normalization: "2times_minus1"
      num_train_steps_factor_upper: 0.4
      adapt_reg_strength: True
      timestep_jitter_fraction: 0.0

trainer:
  scheduler_kwargs:
    patience: 100
  gradient_acc_steps: 1
  iterations: 400

sweep:
  ++regularizer_fn.coupling_regularizer.reg_params.weight: [1e1,1e-4]
  ++regularizer_fn.coupling_regularizer.reg_params_var_spec.target_l1_weight: [1e1,1e-4]
  ++regularizer_fn.appearance_regularizer.reg_params.reg_strength: [1e0,1e-4]
